<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(10, auto);
            grid-gap: 20px;
            margin: 20px;
        }
        .image-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }
        .image-item img {
            width: 50%;
            height: auto;
        }
        .accordion {
            cursor: pointer;
            text-align: center;
            padding: 10px;
            border: none;
            outline: none;
            transition: 0.4s;
            margin-top: 10px;
        }
        .panel {
            padding: 0 18px;
            background-color: white;
            display: none;
            overflow: hidden;
            width: 100%;
        }
        .chart-container {
            height: 200px;
            width: 100%;
        }
        .header {
            position: relative;
            text-align: center;
        }
        .header h3 {
            margin-top: -30px; /* Adjust this value to move the heading upwards */
        }
        .info-text {
            font-size: 14px; /* Büyütülmüş yazı boyutu */
            text-align: center;
            margin-top: 5px; /* Üstten biraz mesafe bırak */
            margin-bottom: 5px; /* Alttan biraz mesafe bırak */
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="wrapper target">
        <div class="left">
            <i class="fa-solid fa-house"></i>
            <i class="fa-solid fa-cow"></i>
        </div>
        <div class="center">
            <a href="/">ANA SAYFA</a>
        </div>
        <div class="right">
            <span>
                <img src="{{ url_for('static', filename='img/5efa0d290ba9df12e0093313fc0ac70b.jpg') }}" alt="5efa0d290ba9df12e0093313fc0ac70b">
            </span>
        </div>
    </div>
</div>

<header class="header target">
    <img src="{{ url_for('static', filename='img/WhatsApp Görsel 2024-05-21 saat 02.44.36_9c8ef631.jpg') }}" alt="background">
    <h1>HAFTALIK SÜT VERİLERİ</h1>
    <h3>Küpe Numaraları</h3>
</header>

<div class="image-grid">
    {% for veri in maku_verileri %}
    <div class="image-item">
        <img src="{{ url_for('static', filename='img/images.jpg') }}" alt="Image {{ loop.index }}">
        <button class="accordion">Küpe No: {{ veri.kupe_numarasi }}</button>
        <div class="panel">
            <div class="chart-container">
                <canvas id="chart{{ loop.index }}"></canvas>
            </div>
            <div class="info-text">Sağımlar 08.30 ile 20.30 saatlerinde yapılmaktadır<br>Sağım süreleri 5 ile 6 dakika aralığında değişmektedir</div>
        </div>
    </div>
    {% endfor %}
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/scroll.js') }}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var acc = document.getElementsByClassName("accordion");
        var makuVerileri = {{ maku_verileri|tojson }};
        for (var i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function(i) {
                return function() {
                    this.classList.toggle("active");
                    var panel = this.nextElementSibling;
                    if (panel.style.display === "block") {
                        panel.style.display = "none";
                    } else {
                        panel.style.display = "block";
                        var canvas = panel.querySelector('canvas');
                        if (canvas) {
                            var ctx = canvas.getContext('2d');
                            var haftalikSutVerisi = makuVerileri[i].haftalik_sut_verisi;
                            new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'],
                                    datasets: [{
                                        label: 'Süt Verimi',
                                        data: haftalikSutVerisi,
                                        borderColor: 'rgba(75, 192, 192, 1)',
                                        borderWidth: 1,
                                        fill: false
                                    }]
                                },
                                options: {
                                    scales: {
                                        y: {
                                            beginAtZero: true
                                        }
                                    }
                                }
                            });
                        }
                    }
                };
            }(i));
        }
    });
</script>
</body>
</html>
